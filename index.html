<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>伝導路マスター｜神経系 暗記トレーニング</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap');

    :root {
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --ink: #2B1D16;
      --ink-muted: #7C6559;
      --cream: #FFF9F3;
      --orange-main: #FF6B2B;
      --orange-deep: #EA580C;
      --orange-glow: rgba(255, 107, 43, 0.22);
    }

    body {
      font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 20% 10%, #FDE7D4 0%, #F5ECE4 48%, #EFE5DC 100%);
      color: var(--ink);
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
      font-feature-settings: "palt";
    }

    .app-shell {
      max-width: 460px;
      margin: 0 auto;
      min-height: 100dvh;
      background: linear-gradient(180deg, #FFF7EE 0%, #FFFBF7 38%, #FFF6EC 100%);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
      box-shadow:
        0 0 0 1px rgba(234, 88, 12, 0.08),
        0 24px 64px -16px rgba(154, 52, 18, 0.16);
    }

    /* Ambient warm glow orbs */
    .ambient-orb-1 {
      position: absolute;
      top: -90px;
      right: -70px;
      width: 240px;
      height: 240px;
      border-radius: 9999px;
      background: radial-gradient(circle, rgba(255, 138, 76, 0.22) 0%, rgba(255, 180, 120, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }
    .ambient-orb-2 {
      position: absolute;
      bottom: 80px;
      left: -80px;
      width: 220px;
      height: 220px;
      border-radius: 9999px;
      background: radial-gradient(circle, rgba(251, 146, 60, 0.16) 0%, rgba(251, 146, 60, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Elevated warm glass card */
    .glass-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(251, 146, 60, 0.18);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.95) inset,
        0 10px 28px -12px rgba(194, 65, 12, 0.12),
        0 2px 6px -1px rgba(194, 65, 12, 0.05);
    }

    /* Tactile pushable chip */
    .tactile-chip {
      background: linear-gradient(180deg, #FFFFFF 0%, #FFFBF7 100%);
      border: 1.5px solid rgba(251, 146, 60, 0.28);
      border-bottom-width: 3.5px;
      border-bottom-color: rgba(234, 88, 12, 0.24);
      box-shadow: 0 4px 12px -4px rgba(194, 65, 12, 0.1);
      transition: transform 0.12s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.15s ease,
                  background-color 0.15s ease,
                  box-shadow 0.15s ease;
    }
    .tactile-chip:hover {
      border-color: #FB923C;
      background: linear-gradient(180deg, #FFFFFF 0%, #FFF4EA 100%);
      box-shadow: 0 8px 18px -6px rgba(234, 88, 12, 0.18);
    }
    .tactile-chip:active {
      transform: translateY(2px) scale(0.985);
      border-bottom-width: 1.5px;
      box-shadow: 0 2px 4px -2px rgba(234, 88, 12, 0.12);
    }

    /* Floating bottom dock */
    .floating-dock-wrap {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 460px;
      padding: 0 14px calc(12px + var(--safe-bottom));
      z-index: 40;
      pointer-events: none;
    }
    .floating-dock {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(251, 146, 60, 0.22);
      box-shadow:
        0 14px 36px -8px rgba(154, 52, 18, 0.18),
        0 2px 8px rgba(154, 52, 18, 0.06),
        0 1px 0 rgba(255, 255, 255, 0.9) inset;
      border-radius: 26px;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .animate-shake {
      animation: shake 0.34s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes popIn {
      0% { transform: scale(0.93) translateY(4px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    .animate-pop {
      animation: popIn 0.24s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes pulseOrange {
      0% { box-shadow: 0 0 0 0 rgba(255, 107, 43, 0.45); }
      70% { box-shadow: 0 0 0 9px rgba(255, 107, 43, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 107, 43, 0); }
    }
    .node-active {
      animation: pulseOrange 1.6s infinite;
    }

    .red-sheet-hidden {
      background: repeating-linear-gradient(
        -45deg,
        #FF5A1F,
        #FF5A1F 10px,
        #F04438 10px,
        #F04438 20px
      ) !important;
      border-color: #DC2626 !important;
      color: transparent !important;
      user-select: none;
      cursor: pointer;
      position: relative;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.28);
    }
    .red-sheet-hidden span {
      opacity: 0 !important;
    }
    .red-sheet-hidden::after {
      content: 'TAP TO PEEK';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.94);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.1em;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .pb-nav {
      padding-bottom: calc(6.2rem + var(--safe-bottom));
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>

    // =========================================================
    // 2. SOUND ENGINE (Web Audio API)
    // =========================================================
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function playTone(type, stepIndex = 0) {
      if (!state.soundOn) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      if (type === 'step') {
        const notes = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66, 1318.51, 1567.98];
        const freq = notes[stepIndex % notes.length];
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.11, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
        osc.start(now);
        osc.stop(now + 0.17);
      } else if (type === 'wrong') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(195, now);
        osc.frequency.linearRampToValueAtTime(145, now + 0.16);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.start(now);
        osc.stop(now + 0.19);
      } else if (type === 'clear') {
        const chord = [523.25, 659.25, 783.99, 1046.50];
        chord.forEach((freq, i) => {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.connect(g);
          g.connect(ctx.destination);
          o.type = 'sine';
          const t = now + i * 0.06;
          o.frequency.setValueAtTime(freq, t);
          g.gain.setValueAtTime(0.09, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
          o.start(t);
          o.stop(t + 0.36);
        });
      }
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function getPathway(id) {
      return PATHWAYS.find(p => p.id === id) || PATHWAYS[0];
    }

    let toastTimer = null;
    function showToast(msg, colorClass = 'bg-[#2B1D16]') {
      const toast = document.getElementById('toast');
      const inner = document.getElementById('toast-inner');
      if (!toast || !inner) return;
      inner.className = `px-4 py-2 rounded-full shadow-xl text-xs font-extrabold text-white flex items-center gap-1.5 whitespace-nowrap ${colorClass}`;
      inner.textContent = msg;
      toast.classList.remove('opacity-0', '-translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', '-translate-y-2');
      }, 1700);
    }

    function initSequence(pathwayId = state.seq.pathwayId) {
      const pw = getPathway(pathwayId);
      state.seq.pathwayId = pw.id;
      state.seq.progress = 0;
      state.seq.mistakes = 0;
      state.seq.wrongChipId = null;
      state.seq.hintChipId = null;
      state.seq.completed = false;

      const baseChips = pw.steps.map((s, idx) => ({
        id: `s_${idx}`,
        stepIdx: idx,
        label: s.label,
        isDecoy: false,
        used: false
      }));

      let decoys = [];
      if (state.seq.hardMode) {
        const existingLabels = new Set(pw.steps.map(s => s.label));
        const pool = [];
        PATHWAYS.forEach(other => {
          if (other.id !== pw.id) {
            other.steps.forEach(st => {
              if (!existingLabels.has(st.label) && !pool.includes(st.label)) {
                pool.push(st.label);
              }
            });
          }
        });
        decoys = shuffle(pool).slice(0, 2).map((lbl, idx) => ({
          id: `d_${idx}`,
          stepIdx: -1,
          label: lbl,
          isDecoy: true,
          used: false
        }));
      }

      state.seq.chips = shuffle([...baseChips, ...decoys]);
    }

    function buildBinaryQuestions(filter) {
      const orderQs = [];
      PATHWAYS.forEach(pw => {
        for (let i = 0; i < pw.steps.length - 1; i++) {
          const curr = pw.steps[i];
          const next = pw.steps[i + 1];
          const sameOthers = pw.steps
            .filter((_, idx) => idx !== i && idx !== i + 1)
            .map(s => s.label);
          let wrongLabel = '';
          if (sameOthers.length > 0 && Math.random() < 0.7) {
            wrongLabel = sameOthers[Math.floor(Math.random() * sameOthers.length)];
          } else {
            const otherPool = PATHWAYS.flatMap(p => p.steps.map(s => s.label))
              .filter(l => l !== curr.label && l !== next.label);
            wrongLabel = otherPool[Math.floor(Math.random() * otherPool.length)];
          }

          orderQs.push({
            topic: 'order',
            pathwayName: pw.name,
            category: pw.category,
            prompt: `「${curr.label}」の次に通るのは？`,
            correct: next.label,
            wrong: wrongLabel,
            explain: `${pw.shortName}の順路：${curr.label} → ${next.label}（${next.tag}）`
          });
        }
      });

      let pool = [];
      if (filter === 'order') {
        pool = orderQs;
      } else if (filter === 'crossing') {
        pool = CONCEPT_BINARY_QUESTIONS.filter(q => q.topic === 'crossing');
      } else if (filter === 'special') {
        pool = [
          ...CONCEPT_BINARY_QUESTIONS.filter(q => q.topic === 'special'),
          ...orderQs.filter(q => q.category === 'special')
        ];
      } else {
        pool = [...shuffle(orderQs).slice(0, 12), ...CONCEPT_BINARY_QUESTIONS];
      }

      return shuffle(pool).slice(0, 10).map(q => {
        const flip = Math.random() < 0.5;
        return {
          ...q,
          left: flip ? q.correct : q.wrong,
          right: flip ? q.wrong : q.correct,
          correctSide: flip ? 'left' : 'right'
        };
      });
    }

    function initBinary(filter = state.bin.filter) {
      state.bin.filter = filter;
      state.bin.queue = buildBinaryQuestions(filter);
      state.bin.index = 0;
      state.bin.score = 0;
      state.bin.combo = 0;
      state.bin.maxCombo = 0;
      state.bin.answered = null;
      state.bin.finished = false;
    }

    function initFill(pathwayId = state.fill.pathwayId) {
      const pw = getPathway(pathwayId);
      state.fill.pathwayId = pw.id;
      const total = pw.steps.length;
      const count = total <= 4 ? 1 : 2;
      const candidateIndices = [];
      for (let i = 1; i < total; i++) candidateIndices.push(i);
      const picked = shuffle(candidateIndices).slice(0, count).sort((a, b) => a - b);

      state.fill.blankIndices = picked;
      state.fill.activeBlankIdx = picked[0];
      state.fill.filled = {};
      state.fill.wrongChoice = null;
      state.fill.completed = false;
      buildFillChoices();
    }

    function buildFillChoices() {
      const pw = getPathway(state.fill.pathwayId);
      const targetIdx = state.fill.activeBlankIdx;
      if (targetIdx === null || targetIdx === undefined) {
        state.fill.choices = [];
        return;
      }
      const correctLabel = pw.steps[targetIdx].label;
      const existingInPw = new Set(pw.steps.map(s => s.label));
      const pool = [];
      PATHWAYS.forEach(other => {
        other.steps.forEach(st => {
          if (st.label !== correctLabel && !existingInPw.has(st.label) && !pool.includes(st.label)) {
            pool.push(st.label);
          }
        });
      });
      const distractors = shuffle(pool).slice(0, 3);
      state.fill.choices = shuffle([correctLabel, ...distractors]);
    }

    // =========================================================
    // 6. EVENT HANDLERS
    // =========================================================
    function handleSequenceTap(chipId) {
      if (state.seq.completed) return;
      const pw = getPathway(state.seq.pathwayId);
      const chip = state.seq.chips.find(c => c.id === chipId);
      if (!chip || chip.used) return;

      const expectedIdx = state.seq.progress;
      if (!chip.isDecoy && chip.stepIdx === expectedIdx) {
        chip.used = true;
        state.seq.progress += 1;
        state.seq.wrongChipId = null;
        state.seq.hintChipId = null;

        if (state.seq.progress >= pw.steps.length) {
          state.seq.completed = true;
          state.mastered[pw.id] = (state.mastered[pw.id] || 0) + 1;
          saveProgress();
          playTone('clear');
          fireConfetti();
        } else {
          playTone('step', expectedIdx);
        }
        render();
        const routeEl = document.getElementById('seq-route-scroll');
        if (routeEl) routeEl.scrollTop = routeEl.scrollHeight;
      } else {
        state.seq.mistakes += 1;
        state.seq.wrongChipId = chipId;
        playTone('wrong');
        showToast(chip.isDecoy ? 'ダミーの部位です！' : '順番が違います。もう一度！', 'bg-rose-600');
        render();
        setTimeout(() => {
          state.seq.wrongChipId = null;
          render();
        }, 420);
      }
    }

    function handleSequenceHint() {
      if (state.seq.completed) return;
      const expectedIdx = state.seq.progress;
      const targetChip = state.seq.chips.find(c => !c.isDecoy && c.stepIdx === expectedIdx);
      if (targetChip) {
        state.seq.hintChipId = targetChip.id;
        showToast(`ヒント：次は「${targetChip.label}」`, 'bg-amber-600');
        render();
      }
    }

    function handleBinaryAnswer(side) {
      if (state.bin.finished || state.bin.answered) return;
      const q = state.bin.queue[state.bin.index];
      const isCorrect = side === q.correctSide;
      state.bin.answered = { selectedSide: side, isCorrect };
      if (isCorrect) {
        state.bin.score += 1;
        state.bin.combo += 1;
        if (state.bin.combo > state.bin.maxCombo) state.bin.maxCombo = state.bin.combo;
        playTone('step', state.bin.combo);
      } else {
        state.bin.combo = 0;
        playTone('wrong');
      }
      render();
    }

    function handleBinaryNext() {
      if (!state.bin.answered) return;
      if (state.bin.index + 1 >= state.bin.queue.length) {
        state.bin.finished = true;
        if (state.bin.score > state.binaryBest) {
          state.binaryBest = state.bin.score;
          saveProgress();
        }
        if (state.bin.score >= 8) {
          playTone('clear');
          fireConfetti();
        }
      } else {
        state.bin.index += 1;
        state.bin.answered = null;
      }
      render();
    }

    function handleFillChoice(choiceLabel) {
      if (state.fill.completed) return;
      const pw = getPathway(state.fill.pathwayId);
      const targetIdx = state.fill.activeBlankIdx;
      const correctLabel = pw.steps[targetIdx].label;

      if (choiceLabel === correctLabel) {
        state.fill.filled[targetIdx] = choiceLabel;
        state.fill.wrongChoice = null;
        const nextBlank = state.fill.blankIndices.find(idx => !state.fill.filled[idx]);
        if (nextBlank !== undefined) {
          state.fill.activeBlankIdx = nextBlank;
          playTone('step', Object.keys(state.fill.filled).length);
          buildFillChoices();
        } else {
          state.fill.activeBlankIdx = null;
          state.fill.completed = true;
          state.fillCleared += 1;
          saveProgress();
          playTone('clear');
          fireConfetti();
        }
        render();
      } else {
        state.fill.wrongChoice = choiceLabel;
        playTone('wrong');
        showToast('ちがいます！前後のつながりを確認しよう', 'bg-rose-600');
        render();
        setTimeout(() => {
          state.fill.wrongChoice = null;
          render();
        }, 420);
      }
    }

    // =========================================================
    // 7. RENDER FUNCTIONS
    // =========================================================
    function updateHeaderAndNav() {
      const masteredCount = Object.keys(state.mastered).filter(k => state.mastered[k] > 0).length;

              <h2 class="text-4xl font-black text-[#2B1D16] tabular-nums mb-1">${state.bin.score} <span class="text-base font-bold text-[#9C8274]">/ ${state.bin.queue.length}問</span></h2>

        `;
      }

      const q = state.bin.queue[state.bin.index];

              </button>

              </button>

          <!-- Instant Feedback -->
          ${ans ? `
            <div class="animate-pop rounded-[24px] p-4 border ${ans.isCorrect ? 'bg-emerald-50/95 border-emerald-200' : 'bg-rose-50/95 border-rose-200'} shadow-sm">
              <div class="flex items-center gap-1.5 font-black text-sm mb-1 ${ans.isCorrect ? 'text-emerald-800' : 'text-rose-800'}">
                <i data-lucide="${ans.isCorrect ? 'sparkles' : 'info'}" class="w-4 h-4"></i>
                ${ans.isCorrect ? 'ナイス！正解！' : '惜しい！ここをチェック'}
              </div>
              <p class="text-xs font-medium leading-relaxed ${ans.isCorrect ? 'text-emerald-900' : 'text-rose-900'} mb-3.5">
                ${q.explain}
              </p>
              <button type="button" data-action="bin-next"
                class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-[#2B1D16] to-[#4A3227] hover:brightness-110 active:scale-[0.98] text-white font-black text-sm shadow-md transition">
                ${state.bin.index + 1 >= state.bin.queue.length ? '結果を見る →' : '次の問題へ →'}
              </button>
            </div>
          ` : `
            <p class="text-center text-[11px] text-[#9C8274] font-semibold">直感でタップしてテンポよく覚えよう！</p>
          `}
        </div>
      `;
    }

    function renderFillView() {
      const pw = getPathway(state.fill.pathwayId);
      const meta = CATEGORY_META[pw.category];
      const nextPw = PATHWAYS[(PATHWAYS.findIndex(p => p.id === pw.id) + 1) % PATHWAYS.length];

      const selectorHtml = PATHWAYS.map(p => `
        <button type="button" data-action="fill-select" data-id="${p.id}"
          class="shrink-0 px-3.5 py-2 rounded-2xl text-xs font-extrabold transition ${
            p.id === pw.id
              ? 'bg-gradient-to-r from-[#FF6B2B] to-[#FF8B3E] text-white shadow-[0_6px_14px_-4px_rgba(234,88,12,0.45)]'
              : 'bg-white/90 text-[#6B5449] border border-orange-200/70'
          }">
          ${p.shortName}
        </button>
      `).join('');

      const nodesHtml = pw.steps.map((step, idx) => {
        const isBlank = state.fill.blankIndices.includes(idx);
        const isFilled = Boolean(state.fill.filled[idx]);
        const isActive = state.fill.activeBlankIdx === idx;
        const isLast = idx === pw.steps.length - 1;

        return `
          <div class="flex items-stretch gap-3">
            <div class="flex flex-col items-center">
              <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center text-[11px] font-black shrink-0 tabular-nums ${
                isBlank && !isFilled
                  ? isActive
                    ? 'bg-gradient-to-br from-[#FF6B2B] to-[#EA580C] border-[#EA580C] text-white node-active'
                    : 'bg-amber-100 border-amber-400 text-amber-800'
                  : meta.nodeDone
              }">
                ${isBlank && !isFilled ? '?' : idx + 1}
              </div>
              ${!isLast ? `<div class="w-[2.5px] flex-1 min-h-[12px] my-0.5 bg-orange-100"></div>` : ''}
            </div>
            <div class="flex-1 pb-2">
              ${isBlank && !isFilled
                ? `<div class="rounded-2xl px-3.5 py-2 border-2 border-dashed ${
                    isActive ? 'border-[#FF6B2B] bg-orange-50/90' : 'border-amber-300 bg-amber-50/50'
                  } flex items-center justify-between gap-2">
                     <span class="text-xs font-black ${isActive ? 'text-[#EA580C]' : 'text-amber-700'}">
                       ${isActive ? 'ここに入る部位を選択 ▼' : '空欄'}
                     </span>
                     <span class="text-[10px] font-bold text-[#8C7062]">${step.tag}</span>
                   </div>`
                : `<div class="rounded-2xl px-3.5 py-2 border ${
                    isFilled ? 'bg-emerald-50 border-emerald-300 animate-pop' : 'bg-white border-orange-100'
                  } flex items-center justify-between gap-2">
                     <span class="text-[13px] font-extrabold text-[#2B1D16]">${step.label}</span>
                     <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${isFilled ? 'bg-emerald-100 text-emerald-700' : 'bg-orange-50 text-[#8C7062]'} shrink-0">${step.tag}</span>
                   </div>`
              }
            </div>
          </div>
        `;
      }).join('');

      const choicesHtml = state.fill.choices.map(lbl => {
        const isWrong = state.fill.wrongChoice === lbl;
        return `
          <button type="button" data-action="fill-choice" data-label="${lbl}"
            class="px-3 py-3.5 rounded-2xl text-[13px] font-extrabold transition ${
              isWrong
                ? 'bg-rose-50 border-2 border-rose-500 text-rose-700 animate-shake'
                : 'tactile-chip text-[#2B1D16]'
            }">
            ${lbl}
          </button>
        `;
      }).join('');

      return `
        <div class="space-y-3.5">
          <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">${selectorHtml}</div>

          <div class="glass-card rounded-[26px] p-4">
            <div class="flex items-center justify-between mb-2">
              <span class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold ${meta.badgeBg}">${pw.direction}</span>
              <span class="text-[11px] font-bold text-[#9C8274] tabular-nums">クリア累計 ${state.fillCleared}回</span>
            </div>
            <h2 class="text-[16px] font-black text-[#2B1D16] tracking-tight mb-3.5">${pw.name}</h2>
            <div>${nodesHtml}</div>
          </div>

          ${state.fill.completed ? `
            <div class="animate-pop bg-gradient-to-br from-[#FF5E1E] via-[#FF7A33] to-[#FFA447] text-white rounded-[26px] p-5 shadow-[0_14px_30px_-8px_rgba(234,88,12,0.5)]">
              <h3 class="text-base font-black mb-1">回路完成！</h3>
              <p class="text-xs text-orange-50 font-medium mb-3.5">${pw.crossing}</p>
              <div class="grid grid-cols-2 gap-2.5">
                <button type="button" data-action="fill-retry" class="py-3 rounded-2xl bg-white/20 hover:bg-white/30 active:scale-95 font-extrabold text-xs transition">
                  別の空欄で再挑戦
                </button>
                <button type="button" data-action="fill-select" data-id="${nextPw.id}" class="py-3 rounded-2xl bg-white text-[#EA580C] active:scale-95 font-black text-xs shadow-sm transition">
                  次：${nextPw.shortName} →
                </button>
              </div>
            </div>
          ` : `
            <div>
              <p class="text-xs font-extrabold text-[#6B5449] mb-2.5 px-1">空欄に入る構造を選んでください</p>
              <div class="grid grid-cols-2 gap-2.5">${choicesHtml}</div>
            </div>
          `}
        </div>
      `;
    }

    function renderGuideView() {
      const filters = [
        { id: 'all', label: 'すべて (10)' },
        { id: 'descending', label: '下行性' },
        { id: 'somatosensory', label: '体性感覚' },
        { id: 'special', label: '特殊感覚' }
      ];

      const list = PATHWAYS.filter(p => state.guide.filter === 'all' || p.category === state.guide.filter);

      const cardsHtml = list.map(pw => {
        const meta = CATEGORY_META[pw.category];
        const isOpen = state.guide.expandedId === pw.id;
        const masteredCount = state.mastered[pw.id] || 0;

        return `
          <div class="glass-card rounded-[24px] overflow-hidden transition-all">
            <button type="button" data-action="guide-toggle" data-id="${pw.id}"
              class="w-full p-4 flex items-center justify-between gap-3 text-left hover:bg-orange-50/40 transition">
              <div class="min-w-0">
                <div class="flex items-center gap-1.5 mb-1">
                  <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold ${meta.badgeBg}">${pw.direction}</span>
                  <span class="text-[10px] font-bold text-[#9C8274] tabular-nums">${pw.steps.length}ステップ</span>
                  ${masteredCount > 0 ? `<span class="text-[10px] font-extrabold text-[#EA580C]">★ ${masteredCount}回</span>` : ''}
                </div>
                <h3 class="text-[14px] font-black text-[#2B1D16] truncate">${pw.name}</h3>
                <p class="text-[11px] font-medium text-[#7C6559] truncate mt-0.5">${pw.crossing}</p>
              </div>
              <div class="w-8 h-8 rounded-xl bg-orange-50 text-[#EA580C] flex items-center justify-center shrink-0">
                <i data-lucide="${isOpen ? 'chevron-up' : 'chevron-down'}" class="w-4 h-4"></i>
              </div>
            </button>

            ${isOpen ? `
              <div class="px-4 pb-4 pt-2 border-t border-orange-100/80 space-y-3">
                <div class="${meta.softBg} rounded-2xl p-3.5 text-xs text-[#4A372E] leading-relaxed">
                  <p class="font-black text-[#2B1D16] mb-0.5">交叉・特徴</p>
                  <p class="font-semibold">${pw.crossing}</p>
                  <p class="mt-1.5 text-[11px] text-[#6B5449]">💡 ${pw.memo}</p>
                </div>

                <div class="space-y-1.5">
                  ${pw.steps.map((st, idx) => {
                    const key = `${pw.id}_${idx}`;
                    const isHidden = state.guide.redSheet && !state.guide.revealedNodes[key];
                    return `
                      <div class="flex items-center gap-2.5">
                        <span class="w-5 h-5 rounded-full text-[10px] font-black flex items-center justify-center shrink-0 tabular-nums ${meta.nodeDone}">${idx + 1}</span>
                        <div data-action="guide-peek" data-key="${key}"
                          class="flex-1 rounded-xl border border-orange-100 px-3 py-2 flex items-center justify-between gap-2 transition ${isHidden ? 'red-sheet-hidden' : 'bg-white'}">
                          <span class="text-xs font-extrabold text-[#2B1D16]">${st.label}</span>
                          <span class="text-[10px] font-bold text-[#8C7062] shrink-0">${st.tag}</span>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>

                <div class="grid grid-cols-2 gap-2.5 pt-1">
                  <button type="button" data-action="guide-play-seq" data-id="${pw.id}"
                    class="py-3 rounded-2xl bg-gradient-to-r from-[#FF6B2B] to-[#FF8A3D] text-white text-xs font-black shadow-sm active:scale-95 transition">
                    順番タップで練習
                  </button>
                  <button type="button" data-action="guide-play-fill" data-id="${pw.id}"
                    class="py-3 rounded-2xl bg-orange-50 border border-orange-200/80 text-[#C2410C] text-xs font-black active:scale-95 transition">
                    穴埋めで練習
                  </button>
                </div>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');

      return `
        <div class="space-y-3.5">
          <!-- Red Sheet Toggle Banner -->
          <div class="glass-card rounded-[24px] p-4 flex items-center justify-between gap-3">
            <div>
              <p class="text-[13px] font-black text-[#2B1D16]">赤シート暗記モード</p>
              <p class="text-[11px] font-medium text-[#7C6559]">部位名を隠してタップで答え合わせ</p>
            </div>
            <button type="button" data-action="guide-redsheet"
              class="px-3.5 py-2.5 rounded-2xl text-xs font-black transition active:scale-95 flex items-center gap-1.5 shrink-0 ${
                state.guide.redSheet
                  ? 'bg-gradient-to-r from-[#FF4D2B] to-[#E11D48] text-white shadow-[0_6px_14px_-4px_rgba(225,29,72,0.5)]'
                  : 'bg-orange-50 text-[#EA580C] border border-orange-200'
              }">
              <i data-lucide="eye-off" class="w-3.5 h-3.5"></i>
              ${state.guide.redSheet ? '赤シート ON' : '赤シート OFF'}
            </button>
          </div>

          <div class="flex gap-2 overflow-x-auto no-scrollbar">
            ${filters.map(f => `
              <button type="button" data-action="guide-filter" data-filter="${f.id}"
                class="shrink-0 px-3.5 py-2 rounded-2xl text-xs font-extrabold transition ${
                  state.guide.filter === f.id
                    ? 'bg-gradient-to-r from-[#FF6B2B] to-[#FF8B3E] text-white shadow-[0_6px_14px_-4px_rgba(234,88,12,0.45)]'
                    : 'bg-white/90 text-[#6B5449] border border-orange-200/70'
                }">
                ${f.label}
              </button>
            `).join('')}
          </div>

          <div class="space-y-3">${cardsHtml}</div>
        </div>
      `;
    }

    function render() {
      updateHeaderAndNav();
      const main = document.getElementById('main-content');
      if (!main) return;

      if (state.activeTab === 'sequence') {
        main.innerHTML = renderSequenceView();
      } else if (state.activeTab === 'binary') {
        main.innerHTML = renderBinaryView();
      } else if (state.activeTab === 'fill') {
        main.innerHTML = renderFillView();
      } else {
        main.innerHTML = renderGuideView();
      }

      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons();
      }
    }

    // =========================================================
    // 8. DELEGATED EVENT LISTENERS
    // =========================================================
    document.addEventListener('click', e => {
      const navBtn = e.target.closest('.nav-btn');
      if (navBtn) {
        const tab = navBtn.dataset.tab;
        state.activeTab = tab;
        if (tab === 'binary' && state.bin.queue.length === 0) initBinary();
        if (tab === 'fill' && state.fill.blankIndices.length === 0) initFill();
        render();
        document.getElementById('main-content').scrollTop = 0;
        return;
      }

      const soundBtn = e.target.closest('#sound-toggle-btn');
      if (soundBtn) {
        state.soundOn = !state.soundOn;
        saveProgress();
        showToast(state.soundOn ? '効果音 ON' : '効果音 OFF');
        render();
        return;
      }

      const actionEl = e.target.closest('[data-action]');
      if (!actionEl) return;
      const action = actionEl.dataset.action;

      switch (action) {
        case 'seq-select':
          initSequence(actionEl.dataset.id);
          render();
          break;
        case 'seq-tap':
          handleSequenceTap(actionEl.dataset.chip);
          break;
        case 'seq-hint':
          handleSequenceHint();
          break;
        case 'seq-retry':
          initSequence(state.seq.pathwayId);
          render();
          break;
        case 'seq-toggle-hard':
          state.seq.hardMode = !state.seq.hardMode;
          initSequence(state.seq.pathwayId);
          showToast(state.seq.hardMode ? 'ダミー2個を追加しました' : '標準モードに切り替えました');
          render();
          break;

        case 'bin-filter':
          initBinary(actionEl.dataset.filter);
          render();
          break;
        case 'bin-answer':
          handleBinaryAnswer(actionEl.dataset.side);
          break;
        case 'bin-next':
          handleBinaryNext();
          break;
        case 'bin-restart':
          initBinary(state.bin.filter);
          render();
          break;

        case 'fill-select':
          initFill(actionEl.dataset.id);
          render();
          break;
        case 'fill-choice':
          handleFillChoice(actionEl.dataset.label);
          break;
        case 'fill-retry':
          initFill(state.fill.pathwayId);
          render();
          break;

        case 'guide-filter':
          state.guide.filter = actionEl.dataset.filter;
          render();
          break;
        case 'guide-redsheet':
          state.guide.redSheet = !state.guide.redSheet;
          state.guide.revealedNodes = {};
          render();
          break;
        case 'guide-toggle':
          state.guide.expandedId = state.guide.expandedId === actionEl.dataset.id ? null : actionEl.dataset.id;
          render();
          break;
        case 'guide-peek':
          if (state.guide.redSheet) {
            const k = actionEl.dataset.key;
            state.guide.revealedNodes[k] = !state.guide.revealedNodes[k];
            render();
          }
          break;
        case 'guide-play-seq':
          state.activeTab = 'sequence';
          initSequence(actionEl.dataset.id);
          render();
          document.getElementById('main-content').scrollTop = 0;
          break;
        case 'guide-play-fill':
          state.activeTab = 'fill';
          initFill(actionEl.dataset.id);
          render();
          document.getElementById('main-content').scrollTop = 0;
          break;
      }
    });

    document.addEventListener('keydown', e => {
      if (state.activeTab !== 'binary' || state.bin.finished) return;
      if (!state.bin.answered) {
        if (e.key === '1' || e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
          handleBinaryAnswer('left');
        } else if (e.key === '2' || e.key === 'ArrowRight' || e.key === 'b' || e.key === 'B') {
          handleBinaryAnswer('right');
        }
      } else if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        handleBinaryNext();
      }
    });

    initSequence('pyramidal_lateral');
    initBinary('all');
    initFill('pyramidal_lateral');
    render();
  </script>
</body>
</html>
